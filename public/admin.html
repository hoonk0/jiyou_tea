<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 — 상품 관리 · 차예마을</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .admin-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .admin-head h1 { color: var(--wine); font-size: 22px; }
    .admin-grid { display: grid; grid-template-columns: 360px 1fr; gap: 32px; align-items: start; }
    .form-card { border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
    .form-card h2 { margin: 0 0 16px; font-size: 17px; }
    label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
    input[type=text], input[type=number], select, textarea {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line);
      border-radius: 6px; font-size: 14px; font-family: inherit; resize: vertical;
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .checkbox { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; }
    .checkbox input { width: auto; }
    .submit-btn {
      width: 100%; margin-top: 18px; padding: 12px; border: none; border-radius: 6px;
      background: var(--wine); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .submit-btn:hover { background: var(--wine-dark); }
    .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .msg.ok { color: #1a8a3f; }
    .msg.err { color: var(--wine); }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { color: #666; font-size: 12px; font-weight: 600; }
    .thumb-sm { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; background: #f4f4f4; }
    .del-btn { background: none; border: 1px solid var(--line); border-radius: 5px; color: var(--wine); padding: 5px 10px; cursor: pointer; }
    .del-btn:hover { background: var(--wine); color: #fff; border-color: var(--wine); }
    .pill { background: #f4f4f4; border-radius: 4px; padding: 2px 8px; font-size: 12px; }
    .edit-btn { background: none; border: 1px solid var(--line); border-radius: 5px; color: #555; padding: 5px 10px; cursor: pointer; margin-right: 6px; }
    .edit-btn:hover { border-color: var(--ink); color: var(--ink); }

    /* 로그인 오버레이 */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .overlay.hidden { display: none; }
    .login-box { background: #fff; border-radius: 10px; padding: 32px; width: 320px; text-align: center; }
    .login-box h2 { color: var(--wine); margin: 0 0 6px; }
    .login-box p { color: #888; font-size: 13px; margin: 0 0 20px; }
    .login-box input { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 6px; font-size: 15px; }
    .login-box button { width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: 6px; background: var(--wine); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    .login-err { color: var(--wine); font-size: 13px; min-height: 18px; margin-top: 8px; }
    .logout-btn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; cursor: pointer; color: #555; }

    /* 수정 모달 */
    .modal-body { background: #fff; border-radius: 10px; padding: 24px; width: 420px; max-height: 90vh; overflow: auto; }
    .modal-body h2 { margin: 0 0 16px; font-size: 18px; }
    .cur-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; background: #f4f4f4; border: 1px solid var(--line); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 11px; border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-save { background: var(--wine); color: #fff; border: none; }
    .btn-cancel { background: #fff; color: #555; border: 1px solid var(--line); }
  </style>
</head>
<body>
  <!-- 로그인 오버레이 -->
  <div class="overlay" id="login-overlay">
    <div class="login-box">
      <h2>차예마을 관리자</h2>
      <p>상품을 관리하려면 로그인하세요</p>
      <form id="login-form">
        <input type="password" id="login-pw" placeholder="비밀번호" autocomplete="current-password" />
        <button type="submit">로그인</button>
        <p class="login-err" id="login-err"></p>
      </form>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div class="overlay hidden" id="edit-overlay">
    <div class="modal-body">
      <h2>상품 수정</h2>
      <form id="edit-form">
        <input type="hidden" name="id" />
        <label>상품명 *</label>
        <input type="text" name="name" required />
        <label>카테고리</label>
        <select name="category" id="edit-category"></select>
        <label>특징 / 설명</label>
        <textarea name="desc" rows="2"></textarea>
        <div class="row2">
          <div><label>원산지</label><input type="text" name="origin" /></div>
          <div><label>브랜드</label><input type="text" name="brand" /></div>
        </div>
        <div class="row2">
          <div><label>정가(원)</label><input type="number" name="price" min="0" /></div>
          <div><label>판매가(원)</label><input type="number" name="salePrice" min="0" /></div>
        </div>
        <div class="row2">
          <div><label>할인율(%)</label><input type="number" name="discount" min="0" max="99" /></div>
          <div><label>평점(0~5)</label><input type="number" name="rating" min="0" max="5" step="0.1" /></div>
        </div>
        <label>리뷰 수</label>
        <input type="number" name="reviews" min="0" />
        <label>현재 이미지</label>
        <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
          <img class="cur-thumb" id="edit-cur-img" />
          <label class="checkbox" style="margin:0"><input type="checkbox" name="removeImage" /> 이미지 삭제</label>
        </div>
        <label>이미지 교체 (새 파일 선택)</label>
        <input type="file" name="image" accept="image/*" />
        <label class="checkbox"><input type="checkbox" name="soldOut" /> 품절 표시</label>
        <p class="msg err" id="edit-msg"></p>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="edit-cancel">취소</button>
          <button type="submit" class="btn-save">저장</button>
        </div>
      </form>
    </div>
  </div>

  <div class="header-line"></div>
  <div class="admin">
    <div class="admin-head">
      <h1>상품 관리</h1>
      <div style="display:flex;gap:14px;align-items:center">
        <a href="/" style="color:var(--wine)">← 쇼핑몰로</a>
        <button class="logout-btn" id="logout-btn">로그아웃</button>
      </div>
    </div>

    <div class="admin-grid">
      <!-- 상품 추가 폼 -->
      <div class="form-card">
        <h2>상품 추가</h2>
        <form id="add-form">
          <label>상품명 *</label>
          <input type="text" name="name" required placeholder="예) 2004년 홍대익 7572 숙 357g" />

          <label>카테고리</label>
          <select name="category" id="category-select"></select>

          <label>특징 / 설명</label>
          <textarea name="desc" rows="2" placeholder="예) 묵직한 대추향, 부드러운 목넘김"></textarea>

          <div class="row2">
            <div><label>원산지</label><input type="text" name="origin" placeholder="예) 중국 운남" /></div>
            <div><label>브랜드</label><input type="text" name="brand" placeholder="예) 맹해차창" /></div>
          </div>

          <div class="row2">
            <div>
              <label>정가(원)</label>
              <input type="number" name="price" min="0" value="0" />
            </div>
            <div>
              <label>판매가(원)</label>
              <input type="number" name="salePrice" min="0" value="0" />
            </div>
          </div>

          <div class="row2">
            <div>
              <label>할인율(%)</label>
              <input type="number" name="discount" min="0" max="99" value="0" />
            </div>
            <div>
              <label>평점(0~5)</label>
              <input type="number" name="rating" min="0" max="5" step="0.1" value="0" />
            </div>
          </div>

          <label>리뷰 수</label>
          <input type="number" name="reviews" min="0" value="0" />

          <label>상품 이미지</label>
          <input type="file" name="image" accept="image/*" />

          <label class="checkbox"><input type="checkbox" name="soldOut" /> 품절 표시</label>

          <button type="submit" class="submit-btn">상품 등록</button>
          <p class="msg" id="msg"></p>
        </form>
      </div>

      <!-- 상품 목록 -->
      <div>
        <h2 style="font-size:17px;margin:0 0 12px">등록된 상품 <span id="count" class="pill">0</span></h2>
        <table>
          <thead>
            <tr><th>이미지</th><th>상품명</th><th>카테고리</th><th>가격</th><th>관리</th></tr>
          </thead>
          <tbody id="product-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
